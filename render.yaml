services:
  - type: web
    name: salamat-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: salamat-db
          property: connectionString

databases:
  - name: salamat-db
    plan: free          # Render's free Postgres expires after 30 days; upgrade for real use
    databaseName: salamat
    user: salamat
