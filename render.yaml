services:
  - type: web
    name: salamat-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "10000"
      # Free plan disk is wiped on redeploy; attach a disk (paid) or use Postgres
      # via DATABASE_URL to keep user data permanently.
