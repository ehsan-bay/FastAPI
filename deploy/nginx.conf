# Nginx site for Salamat AI (use when you already run Nginx instead of Caddy).
# /etc/nginx/sites-available/salamat  ->  symlink into sites-enabled, then:
#   sudo certbot --nginx -d health.example.com
server {
    listen 80;
    server_name health.example.com;   # CHANGE

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # OCR / LLM can take a while on small CPUs
    }
}
