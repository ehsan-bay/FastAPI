name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: salamat, POSTGRES_PASSWORD: salamat, POSTGRES_DB: salamat }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/download_models.py
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        run: python -m pytest -q
        env: { TEST_DATABASE_URL: "postgresql://salamat:salamat@localhost:5432/salamat" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: pwa-dist, path: app/dist }

  android:
    runs-on: ubuntu-latest
    needs: web
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # Set the repository variable SERVER_URL (e.g. https://salamat-ai.onrender.com)
      # so the app connects to your server without asking.
      - run: npm run build
        env: { VITE_API_URL: "${{ vars.SERVER_URL || 'https://salamatyar.tosantechno.ir' }}" }
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: salamat-ai-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
