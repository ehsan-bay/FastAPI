name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: salamat, POSTGRES_PASSWORD: salamat, POSTGRES_DB: salamat }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/download_models.py
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        run: python -m pytest -q
        env: { TEST_DATABASE_URL: "postgresql://salamat:salamat@localhost:5432/salamat" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: pwa-dist, path: app/dist }

  android:
    runs-on: ubuntu-latest
    needs: web
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # GitHub's Ubuntu runners already ship the Android SDK ($ANDROID_HOME); only accept the licenses
      # so Gradle may install any missing platform/build-tools by itself.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      # Set the repository variable SERVER_URL (e.g. https://salamat-ai.onrender.com)
      # so the app connects to your server without asking.
      - run: npm run build
        env: { VITE_API_URL: "${{ vars.SERVER_URL || 'https://salamatyar.tosantechno.ir' }}" }
      - run: npx cap sync android
      # Optional real signing key for store releases. Add these repository secrets to use it:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Without them the APK is signed with the fixed test key in app/android/app/signing/.
      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SALAMAT_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "SALAMAT_KEYSTORE_PASSWORD=$KS_PASS"
              echo "SALAMAT_KEY_ALIAS=$KEY_ALIAS"
              echo "SALAMAT_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "signing with the release key"
          else
            echo "no release key secrets: signing with the fixed test key"
          fi
      - run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: app/android
      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/Salamatyar-1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la dist-apk
      - uses: actions/upload-artifact@v4
        with:
          name: salamat-ai-apk
          path: app/dist-apk/*.apk
