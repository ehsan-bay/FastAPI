# Salamat AI — app + PostgreSQL (+ optional Caddy for automatic HTTPS).
#   cp .env.example .env   # then edit it
#   docker compose up -d --build                    # app on :8000
#   docker compose --profile https up -d --build    # + HTTPS on :80/:443 for $DOMAIN
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salamat}
      POSTGRES_USER: ${POSTGRES_USER:-salamat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        WITH_LLM: ${WITH_LLM:-0}
    image: salamat-ai:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-salamat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salamat}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LLM_THREADS: ${LLM_THREADS:-2}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
